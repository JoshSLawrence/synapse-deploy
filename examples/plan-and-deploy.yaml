# Builds the workspace template from the Git folder, shows what a pull request
# would change, and deploys on main.
#
# Replace before use:
# - myworkspace: the target workspace's name
# - workspace/: the Synapse Git folder (it needs a mise.toml that pins node)
# - environment "production": an environment with a federated credential for
#   this repository and environment
# - workspace/parameters/production.json: your own ARM parameters file with the
#   target workspace's values; the exported parameters file carries the source
#   workspace's, and later files win
# - environment "production-plan": a separate environment with its own
#   federated credential, ideally a read-only identity (Synapse Artifact
#   User; listing the workspace under it is untested)
# - the repository variables AZURE_CLIENT_ID and AZURE_TENANT_ID
#
# The build job needs no credentials. The plan job runs for pull requests from
# this repository only: pull requests from forks get no OIDC token. A pull
# request can edit this workflow, so the plan job must not use the production
# environment or identity.
name: Plan and deploy Synapse

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: synapse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: JoshSLawrence/actions/shared/setup@40c13146c9512361c323fcc49134c832cfdc3c03 # v0.6.0
        with:
          working-directory: workspace
          required-tools: node

      - id: build
        uses: JoshSLawrence/actions/synapse/build@40c13146c9512361c323fcc49134c832cfdc3c03 # v0.6.0
        with:
          working-directory: workspace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template
          path: ${{ steps.build.outputs.template-dir }}
          if-no-files-found: error

  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment: production-plan
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template
          path: template

      - uses: JoshSLawrence/synapse-deploy@v1
        with:
          workspace-name: myworkspace
          template-file: template/TemplateForWorkspace.json
          parameters-file: |
            template/TemplateParametersForWorkspace.json
            workspace/parameters/production.json
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          delete-artifacts: true
          dry-run: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template
          path: template

      - uses: JoshSLawrence/synapse-deploy@v1
        with:
          workspace-name: myworkspace
          template-file: template/TemplateForWorkspace.json
          parameters-file: |
            template/TemplateParametersForWorkspace.json
            workspace/parameters/production.json
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          delete-artifacts: true
