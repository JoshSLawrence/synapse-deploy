# Deploys the fixture workspace to the test workspace, checks the result and
# restores the workspace. Dispatch only: the azure-e2e environment holds the
# test identity, so this must never run on pull requests. A successful run of
# this workflow on a commit is what Release requires.
name: Azure E2E

on:
  workflow_dispatch:

permissions: {}

# One run at a time: the workspace is shared, and a second run would delete
# the first one's artifacts.
concurrency:
  group: azure-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Azure E2E
    runs-on: ubuntu-latest
    environment: azure-e2e
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SYNAPSE_WORKSPACE: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Start
        run: |
          # The run log is public: debug logging would print the HTTP trace.
          if [ "${RUNNER_DEBUG:-}" = "1" ]; then
            echo "::error::Public runs must not log at debug level: re-run without 'Enable debug logging'."
            exit 1
          fi
          echo "Azure E2E at ${GITHUB_SHA}"
          echo "E2E_DIR=${RUNNER_TEMP}/azure-e2e" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/azure-e2e/results"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover the storage target and prepare the templates
        id: prepare
        run: .github/scripts/azure-e2e/prepare.sh "$E2E_DIR/templates"

      - name: Snapshot the workspace before (it must be empty)
        id: before
        run: .github/scripts/azure-e2e/snapshot.sh "$E2E_DIR/results/before.txt" --require-empty

      - name: Deploy v1
        id: v1
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/v1/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters.json
          parameters: ${{ steps.prepare.outputs.params_v1 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"

      - name: Check v1 (counts, artifacts, lake children)
        env:
          DEPLOYED: ${{ steps.v1.outputs.deployed }}
          SKIPPED: ${{ steps.v1.outputs.skipped }}
          DELETED: ${{ steps.v1.outputs.deleted }}
        run: |
          .github/scripts/azure-e2e/snapshot.sh "$E2E_DIR/results/after-v1.txt"
          .github/scripts/azure-e2e/check.sh counts "deploy v1" "$E2E_DIR/templates/v1/TemplateForWorkspace.json" \
            "$DEPLOYED" "$SKIPPED" "$DELETED" 0 "$E2E_DIR/results/outputs.jsonl"
          .github/scripts/azure-e2e/check.sh state v1 "$E2E_DIR/results/after-v1.txt"

      - name: Redeploy v1 unchanged
        id: v1b
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/v1/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters.json
          parameters: ${{ steps.prepare.outputs.params_v1 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"

      - name: Check the redeploy (counts, nothing changed)
        env:
          DEPLOYED: ${{ steps.v1b.outputs.deployed }}
          SKIPPED: ${{ steps.v1b.outputs.skipped }}
          DELETED: ${{ steps.v1b.outputs.deleted }}
        run: |
          .github/scripts/azure-e2e/snapshot.sh "$E2E_DIR/results/after-v1-redeploy.txt"
          .github/scripts/azure-e2e/check.sh counts "redeploy v1" "$E2E_DIR/templates/v1/TemplateForWorkspace.json" \
            "$DEPLOYED" "$SKIPPED" "$DELETED" 0 "$E2E_DIR/results/outputs.jsonl"
          .github/scripts/azure-e2e/check.sh unchanged "$E2E_DIR/results/after-v1.txt" "$E2E_DIR/results/after-v1-redeploy.txt"

      - name: Dry run v2 with delete-artifacts
        id: dry
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/v2/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters-v2.json
          parameters: ${{ steps.prepare.outputs.params_v2 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"
          delete-artifacts: "true"
          dry-run: "true"

      - name: Check the dry run (planned deletions, nothing changed)
        env:
          DEPLOYED: ${{ steps.dry.outputs.deployed }}
          SKIPPED: ${{ steps.dry.outputs.skipped }}
          DELETED: ${{ steps.dry.outputs.deleted }}
        run: |
          .github/scripts/azure-e2e/snapshot.sh "$E2E_DIR/results/after-dry-run.txt"
          .github/scripts/azure-e2e/check.sh counts "dry run v2" "$E2E_DIR/templates/v2/TemplateForWorkspace.json" \
            "$DEPLOYED" "$SKIPPED" "$DELETED" 6 "$E2E_DIR/results/outputs.jsonl"
          .github/scripts/azure-e2e/check.sh unchanged "$E2E_DIR/results/after-v1-redeploy.txt" "$E2E_DIR/results/after-dry-run.txt"

      - name: Deploy v2 with delete-artifacts
        id: v2
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/v2/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters-v2.json
          parameters: ${{ steps.prepare.outputs.params_v2 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"
          delete-artifacts: "true"

      - name: Check v2 (deleted artifacts, deleted lake children)
        env:
          DEPLOYED: ${{ steps.v2.outputs.deployed }}
          SKIPPED: ${{ steps.v2.outputs.skipped }}
          DELETED: ${{ steps.v2.outputs.deleted }}
          DRY_DELETED: ${{ steps.dry.outputs.deleted }}
        run: |
          .github/scripts/azure-e2e/snapshot.sh "$E2E_DIR/results/after-v2.txt"
          .github/scripts/azure-e2e/check.sh counts "deploy v2" "$E2E_DIR/templates/v2/TemplateForWorkspace.json" \
            "$DEPLOYED" "$SKIPPED" "$DELETED" 6 "$E2E_DIR/results/outputs.jsonl"
          if [ "$DELETED" != "$DRY_DELETED" ]; then
            echo "::error::The dry run planned ${DRY_DELETED} deletion(s), the deployment made ${DELETED}."
            exit 1
          fi
          .github/scripts/azure-e2e/check.sh state v2 "$E2E_DIR/results/after-v2.txt"

      # Drop the next four steps if the test identity cannot start triggers:
      # starting one takes a role beyond the minimal ones the README names,
      # and widening the role for this check is not worth it.
      - name: Start trigger tr_e2e_daily
        id: start-trigger
        run: az synapse trigger start --workspace-name "$AZURE_SYNAPSE_WORKSPACE" --name tr_e2e_daily --output none

      - name: Deploy a changed trigger while it is started (must fail)
        id: changed-trigger
        continue-on-error: true
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/v2-trigger/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters-v2.json
          parameters: ${{ steps.prepare.outputs.params_v2 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"

      - name: Stop trigger tr_e2e_daily
        if: always() && steps.start-trigger.outcome == 'success'
        run: az synapse trigger stop --workspace-name "$AZURE_SYNAPSE_WORKSPACE" --name tr_e2e_daily --output none

      - name: Check the started trigger refused the change
        env:
          OUTCOME: ${{ steps.changed-trigger.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::The changed-trigger deployment ended '${OUTCOME}', expected 'failure': a started trigger must refuse the update, and the action must report it."
            exit 1
          fi

      - name: Cleanup - stop the trigger
        if: always() && steps.before.outcome == 'success'
        run: az synapse trigger stop --workspace-name "$AZURE_SYNAPSE_WORKSPACE" --name tr_e2e_daily --output none || true

      - name: Cleanup - deploy an empty template with delete-artifacts
        id: empty
        if: always() && steps.before.outcome == 'success'
        continue-on-error: true
        uses: ./
        with:
          workspace-name: ${{ secrets.AZURE_SYNAPSE_WORKSPACE }}
          template-file: ${{ runner.temp }}/azure-e2e/templates/empty/TemplateForWorkspace.json
          parameters-file: test/fixtures/azure-e2e/parameters.json
          parameters: ${{ steps.prepare.outputs.params_v1 }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          deploy-managed-private-endpoints: "true"
          delete-artifacts: "true"

      # The action never deletes integration runtimes, and a failed run may
      # have stopped anywhere: this deletes whatever is left beyond the
      # starting state, then fails the job unless the workspace matches it.
      - name: Cleanup - delete what remains and verify
        if: always() && steps.before.outcome == 'success'
        run: .github/scripts/azure-e2e/cleanup.sh "$E2E_DIR/results/before.txt" "$E2E_DIR/cleanup"

      - name: Cleanup - fail if the empty-template deployment failed
        if: always() && steps.empty.outcome == 'failure'
        run: |
          echo "::error::The empty-template deployment failed, though the workspace was then restored by hand. See that step's log."
          exit 1

  # The job's own log is served only once it has completed, so the check
  # that nothing leaked into it runs as a second job.
  log-check:
    name: Azure E2E log check
    needs: e2e
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Azure E2E log for leaked values
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: .github/scripts/azure-e2e/log-check.sh "$RUN_ID"
